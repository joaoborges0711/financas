<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="theme-color" content="#ecebf3">
<title>Finanças</title>
<style>
:root{
  --accent:#6c5ce7;
  --bg:#ecebf3; --surface:#ffffff; --surface2:#f5f4f9; --text:#1c1a26; --muted:#7c7990; --line:rgba(24,18,48,.08);
  --ok:#10b981; --warn:#f59e0b; --bad:#ef4444; --gold:#f5b301;
  --r:16px; --pr:calc(var(--r) + 6px); --fs:16px;
  --soft:color-mix(in srgb,var(--accent) 12%,transparent);
  --shadow:0 1px 2px rgba(24,18,48,.05),0 12px 32px -14px rgba(24,18,48,.22);
  --ease:cubic-bezier(.22,.8,.26,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
[data-theme=dark]{
  --bg:#0e0d13; --surface:#1a1922; --surface2:#23222d; --text:#f2f1f7; --muted:#9a97ad; --line:rgba(255,255,255,.07);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px -14px rgba(0,0,0,.7);
  --soft:color-mix(in srgb,var(--accent) 22%,transparent);
}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Inter,Roboto,system-ui,sans-serif;line-height:1.35;transition:background .35s var(--ease),color .35s;min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
svg{width:1.2rem;height:1.2rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.noanim *,.noanim *::before,.noanim *::after{transition:none!important;animation:none!important}

.app{max-width:820px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 12px 0}

/* ---------- topo ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px;gap:8px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:calc(var(--r) - 2px);display:grid;place-items:center;font-weight:800;font-size:.95rem;color:#fff;letter-spacing:-.02em;flex:none;
  background:linear-gradient(140deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000));box-shadow:0 8px 20px -8px var(--accent)}
.brand h1{margin:0;font-size:1.3rem;letter-spacing:-.02em}
.top-act{display:flex;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);transition:transform .25s var(--spring),background .2s,color .2s}
.icon-btn:active{transform:scale(.88)}
.icon-btn.sm{width:34px;height:34px;box-shadow:none;background:var(--surface2)}
.icon-btn.sm svg{width:1rem;height:1rem}
#lockBtn.on{background:var(--accent);color:#fff;box-shadow:0 8px 18px -8px var(--accent)}
#setBtn:hover svg{transform:rotate(60deg)}
#setBtn svg{transition:transform .5s var(--ease)}
@media(max-width:380px){.icon-btn{width:36px;height:36px}.top-act{gap:4px}}

/* ---------- seletor de mês ---------- */
.mbar{display:flex;align-items:center;justify-content:center;gap:8px;padding:2px 0 12px}
.mnav{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);transition:transform .25s var(--spring);flex:none}
.mnav:active{transform:scale(.84)}
.mlabel{flex:1;max-width:300px;display:flex;align-items:center;justify-content:center;gap:10px;height:46px;padding:0 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);transition:transform .25s var(--spring);overflow:hidden}
.mlabel:active{transform:scale(.97)}
.mlabel>svg:first-child{color:var(--accent)}
.mlabel>svg:last-child{width:1rem;height:1rem;color:var(--muted)}
.mlabel .tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;min-width:0}
.mlabel .tx b{font-size:1rem;letter-spacing:-.01em;white-space:nowrap}
.mlabel .tx small{font-size:.7rem;color:var(--muted);white-space:nowrap}
.today{display:none;height:34px;padding:0 12px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:700;font-size:.8rem;flex:none}
[data-theme=dark] .today{color:color-mix(in srgb,var(--accent) 70%,#fff)}
.today.show{display:block;animation:rise .35s var(--spring)}
@keyframes mN{from{opacity:0;transform:translateX(22px)}}
@keyframes mP{from{opacity:0;transform:translateX(-22px)}}

/* ---------- abas estilo chrome ---------- */
.tabs{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;scrollbar-width:none;padding:6px calc(var(--pr) + 14px) 0 calc(var(--pr) + 14px)}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:8px;padding:11px 16px 12px;border-radius:14px 14px 0 0;color:var(--muted);font-weight:600;font-size:.92rem;white-space:nowrap;transition:color .25s,background .25s}
.tab .em{font-size:1.05rem;transition:transform .35s var(--spring)}
.tab:not(.active):hover{background:color-mix(in srgb,var(--surface) 50%,transparent);color:var(--text)}
.tab:not(.active)+.tab:not(.active)::before{content:"";position:absolute;left:-1px;top:30%;height:40%;width:1px;background:var(--line)}
.tab.active{background:var(--surface);color:var(--text)}
.tab.active .em{transform:scale(1.18) rotate(-6deg)}
.tab.active::before,.tab.active::after{content:"";position:absolute;bottom:0;width:14px;height:14px;pointer-events:none}
.tab.active::before{left:-14px;background:radial-gradient(circle at 0 0,transparent 13.5px,var(--surface) 14px)}
.tab.active::after{right:-14px;background:radial-gradient(circle at 100% 0,transparent 13.5px,var(--surface) 14px)}
.tab-add{width:32px;height:32px;margin:0 0 6px 10px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none;transition:background .2s,transform .3s var(--spring)}
.tab-add:hover{background:var(--surface);color:var(--text)}
.tab-add:active{transform:rotate(90deg) scale(.9)}

/* ---------- painel ---------- */
.panel{background:var(--surface);border-radius:var(--pr);padding:20px 16px calc(150px + env(safe-area-inset-bottom));min-height:70vh;box-shadow:var(--shadow);transition:background .35s}
.panel.enter>*{animation:slideIn .45s var(--ease) both}
.panel.enter.from-l>*{animation-name:slideInL}
.panel.enter .srow,.panel.enter .cc,.panel.enter .box{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms + 60ms)}
@keyframes slideIn{from{opacity:0;transform:translateX(26px)}}
@keyframes slideInL{from{opacity:0;transform:translateX(-26px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}}

.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:0 4px 14px}
.ph h2{margin:0;font-size:1.35rem;letter-spacing:-.02em}
.ph p{margin:3px 0 0;color:var(--muted);font-size:.85rem}
.ph-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ghost{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:600;font-size:.8rem;transition:transform .2s var(--spring);white-space:nowrap}
[data-theme=dark] .ghost{color:color-mix(in srgb,var(--accent) 70%,#fff)}
.ghost svg{width:.95rem;height:.95rem}
.ghost:active{transform:scale(.93)}

.banner{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;margin:0 0 14px;border-radius:var(--r);background:var(--soft);font-size:.85rem}
.banner span{flex:1}
.banner button:not(.x){font-weight:700;color:var(--accent);padding:6px 10px;border-radius:999px;background:var(--surface)}
.banner .x{opacity:.6;display:grid;place-items:center;width:28px;height:28px}
.lockbar{background:color-mix(in srgb,var(--warn) 16%,transparent);font-weight:600}
.lockbar button:not(.x){color:#b45309}
[data-theme=dark] .lockbar button:not(.x){color:var(--warn)}

/* filtros e adição rápida */
.flts{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none;padding:2px}
.flts::-webkit-scrollbar{display:none}
.flt{padding:7px 13px;border-radius:999px;background:var(--surface2);font-size:.8rem;font-weight:600;color:var(--muted);white-space:nowrap;transition:all .25s var(--spring)}
.flt.on{background:var(--accent);color:#fff;box-shadow:0 6px 14px -6px var(--accent)}
.flt:active{transform:scale(.94)}
.qa{display:flex;align-items:center;gap:6px;margin:0 0 12px;padding:5px 5px 5px 8px;border-radius:calc(var(--r) + 2px);background:var(--surface2);border:1.5px dashed color-mix(in srgb,var(--muted) 38%,transparent);transition:border-color .2s,box-shadow .2s,background .2s}
.qa:focus-within{border-color:var(--accent);border-style:solid;background:var(--surface);box-shadow:0 0 0 4px var(--soft)}
.qa input{border:0;background:none;outline:none;height:40px;font-size:max(16px,1rem);min-width:0}
.qa .qn{flex:1;padding:0 6px}
.qa .qv{width:80px;text-align:right;font-weight:700;padding:0 4px}
.qa .qrep{width:34px;height:34px;border-radius:50%;opacity:.4;font-size:.95rem;flex:none;transition:all .25s var(--spring)}
.qa .qrep.on{opacity:1;background:var(--soft)}
.qa .qgo{width:40px;height:40px;border-radius:calc(var(--r) - 4px);background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;transition:transform .25s var(--spring)}
.qa .qgo:active{transform:scale(.86) rotate(90deg)}
.qa.shake{animation:shake .4s}

/* ---------- itens ---------- */
.list{display:flex;flex-direction:column;gap:6px}
.srow{position:relative;border-radius:var(--r);overflow:hidden}
.sdel{position:absolute;right:0;top:0;bottom:0;width:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--bad);color:#fff;font-size:.72rem;font-weight:700;border-radius:var(--r)}
.sdel{visibility:hidden;transition:visibility 0s .34s}
.srow.open .sdel,.srow.drag .sdel{visibility:visible;transition-delay:0s}
.sdel svg{width:1.1rem;height:1.1rem}
.srow .item{position:relative;z-index:1;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .32s var(--ease),background .2s;will-change:transform}
.srow.open .item{transform:translateX(-96px)}
.srow.drag .item{transition:none}
.item{display:flex;align-items:center;gap:10px;padding:12px 10px 12px 16px;border-radius:var(--r);background:var(--surface2)}
.item::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--ic,transparent);transition:background .3s}
.compact .item{padding:8px 8px 8px 14px}
@media(hover:hover){.item:hover{background:color-mix(in srgb,var(--surface2) 80%,var(--accent) 6%)}}
.item.star{background:linear-gradient(110deg,color-mix(in srgb,var(--gold) 20%,var(--surface2)),var(--surface2) 78%);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--gold) 50%,transparent)}
.item .main{flex:1;min-width:0;cursor:pointer}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .25s}
.sub{margin-top:3px;font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.compact .sub{margin-top:1px}
.val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer;letter-spacing:-.01em}
.item.over .val{color:var(--bad)}
.tag{font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--line);color:var(--muted);white-space:nowrap}
.tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:#c27c00}
[data-theme=dark] .tag.warn{color:var(--warn)}
.tag.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}

.check{width:28px;height:28px;border-radius:50%;border:2px solid color-mix(in srgb,var(--muted) 45%,transparent);display:grid;place-items:center;flex:none;transition:all .3s var(--spring)}
.check svg{width:16px;height:16px;stroke:#fff;stroke-width:3;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s var(--ease) .05s}
.check.on{background:var(--ok);border-color:var(--ok);transform:scale(1.05)}
.check.on svg{stroke-dashoffset:0}
.check:active{transform:scale(.85)}
.item.is-paid .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.item.is-paid .val{color:var(--muted)}
.pop{animation:pop .45s var(--spring)}
@keyframes pop{40%{transform:scale(1.3)}}

.star-btn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:color-mix(in srgb,var(--muted) 55%,transparent);flex:none;transition:transform .3s var(--spring),color .2s}
.star-btn svg{width:1.1rem;height:1.1rem}
.star-btn.on{color:var(--gold)}
.star-btn.on svg{fill:var(--gold)}
.star-btn:active{transform:scale(.75)}
@media(hover:hover){.star-btn:not(.on):hover{color:var(--gold)}}
.rowdel{display:none}
@media(hover:hover){
  .rowdel{display:grid;place-items:center;width:0;height:30px;overflow:hidden;opacity:0;border-radius:50%;color:var(--bad);transition:all .25s var(--ease);flex:none}
  .rowdel svg{width:1rem;height:1rem}
  .item:hover .rowdel{width:30px;opacity:1;background:color-mix(in srgb,var(--bad) 12%,transparent)}
}
body.locked .star-btn,body.locked .rowdel{display:none}
body.locked .check{opacity:.85}
body.locked .fab{opacity:.45}

.prog{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff));transition:width .7s var(--ease)}
.item.done .prog i{background:var(--ok)}
.item.done .nm{color:var(--muted)}

.sumline{display:flex;justify-content:space-between;align-items:baseline;padding:14px 8px 4px;margin-top:8px;border-top:1px dashed var(--line);font-size:.9rem;color:var(--muted)}
.sumline b{font-size:1.15rem;color:var(--text);font-variant-numeric:tabular-nums}
.sumline.sm{border:0;padding:2px 8px;margin:0;font-size:.82rem}
.sumline.sm b{font-size:.9rem}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:2.6rem;display:block;margin-bottom:8px;animation:float 3s ease-in-out infinite}
.empty h3{margin:0 0 4px;color:var(--text)}
.empty p{margin:0 0 16px;font-size:.9rem}
@keyframes float{50%{transform:translateY(-6px)}}

/* ---------- cartões ---------- */
.cards{display:flex;flex-direction:column;gap:14px}
.ccard{display:block;width:100%;text-align:left;padding:18px 18px 16px;border-radius:calc(var(--r) + 4px);color:#fff;position:relative;overflow:hidden;
  background:var(--c);background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 14px 30px -14px var(--c);transition:transform .35s var(--spring)}
.ccard::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-70px;top:-110px;background:rgba(255,255,255,.12)}
.ccard::before{content:"";position:absolute;width:160px;height:160px;border-radius:50%;right:30px;bottom:-110px;background:rgba(255,255,255,.07)}
.ccard:active{transform:scale(.98)}
.cc-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.cc-name{font-weight:700;font-size:1.05rem}
.cc-r{display:flex;align-items:center;gap:8px}
.cc-badge{font-size:.7rem;font-weight:800;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.22)}
.chip{width:34px;height:25px;border-radius:6px;background:linear-gradient(135deg,#f6e27a,#c9a227);opacity:.9}
.cc-lbl{margin-top:20px;font-size:.75rem;opacity:.8;text-transform:uppercase;letter-spacing:.08em;position:relative;z-index:1}
.cc-amt{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.cc-bar{height:5px;border-radius:9px;background:rgba(255,255,255,.22);margin:12px 0 10px;overflow:hidden;position:relative;z-index:1}
.cc-bar i{display:block;height:100%;background:#fff;border-radius:inherit;transition:width .7s var(--ease)}
.cc-foot{display:flex;justify-content:space-between;font-size:.78rem;opacity:.9;gap:8px;position:relative;z-index:1}
.cc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.cc.open .cc-body{grid-template-rows:1fr}
.cc-in{overflow:hidden;min-height:0}
.cc-in>.list,.cc-in>p,.cc-in>.qa{margin-top:10px}
.cc-act{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 4px}
.cc-act .btn{flex:1 1 auto;white-space:nowrap;padding:0 12px;font-size:.88rem}
.cc-act .btn.icon{flex:none;width:46px;padding:0}

/* ---------- resumo ---------- */
.sum-grid{display:grid;gap:12px}
@media(min-width:640px){.sum-grid{grid-template-columns:1fr 1fr}}
.box{background:var(--surface2);border-radius:var(--r);padding:16px}
.box.wide{grid-column:1/-1}
.box h4{margin:0 0 12px;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.box h4 .ghost{text-transform:none;letter-spacing:0;padding:6px 11px}
.box .item{background:var(--surface)}
.box .item.star{background:linear-gradient(110deg,color-mix(in srgb,var(--gold) 20%,var(--surface)),var(--surface) 78%)}
.hero{border-radius:calc(var(--r) + 4px);padding:18px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000));box-shadow:0 14px 30px -14px var(--accent)}
.hero::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;right:-60px;top:-90px;background:rgba(255,255,255,.12)}
.hero>*{position:relative;z-index:1}
.hero .hl{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.hero .hn{font-size:2rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.hero .hs{font-size:.85rem;opacity:.9}
.hero .hbar{height:6px;border-radius:9px;background:rgba(255,255,255,.25);margin:12px 0 10px;overflow:hidden}
.hero .hbar i{display:block;height:100%;background:#fff;border-radius:inherit;transition:width .8s var(--ease)}
.hero .hrow{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;flex-wrap:wrap}
.hero .btn{margin-top:12px;background:rgba(255,255,255,.2);color:#fff}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{position:relative;width:132px;height:132px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:14;transition:stroke-dasharray 1s var(--ease)}
.donut .bgc{stroke:var(--line)}
.donut .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .ctr small{font-size:.7rem;color:var(--muted)}
.donut .ctr b{font-size:.95rem;font-variant-numeric:tabular-nums}
.legend{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.lg{display:flex;align-items:center;gap:8px;font-size:.85rem}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg b{font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-top:6px}
.kv b{color:var(--text);font-variant-numeric:tabular-nums}
.up{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:.88rem;cursor:pointer}
.up:first-of-type{border-top:0}
.up .d{width:38px;height:38px;border-radius:12px;background:var(--surface);display:grid;place-content:center;text-align:center;line-height:1;flex:none}
.up .d b{font-size:.95rem}.up .d small{font-size:.6rem;color:var(--muted)}
.up .n{flex:1;min-width:0}
.up .n>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.up>b{font-variant-numeric:tabular-nums}
.trend{display:flex;align-items:stretch;gap:8px;height:132px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border-radius:10px;transition:transform .25s var(--spring)}
.tcol:active{transform:scale(.94)}
.tcol .bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.tcol .b{display:block;width:42%;max-width:20px;height:0;border-radius:6px 6px 3px 3px;transition:height .8s var(--ease),opacity .25s}
.b.exp{background:var(--accent)}.b.inc{background:var(--ok)}
.tcol small{font-size:.72rem;color:var(--muted);text-transform:capitalize}
.tcol.sel small{color:var(--text);font-weight:700}
.tcol:not(.sel) .b{opacity:.5}
.tleg{display:flex;gap:14px;font-size:.75rem;color:var(--muted);margin-top:10px}
.tleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}

/* ---------- dock inferior ---------- */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(796px,calc(100% - 24px));display:flex;align-items:center;gap:12px;padding:12px 12px 12px 18px;border-radius:calc(var(--r) + 8px);
  background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--line);box-shadow:var(--shadow);z-index:20}
.d-info{flex:1;min-width:0}
.d-lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.d-val{font-size:1.55rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.d-bar{height:4px;border-radius:9px;background:var(--line);margin:6px 0 5px;overflow:hidden;transition:opacity .3s}
.d-bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:inherit;transition:width .7s var(--ease)}
.d-bar.hide{opacity:0;height:0;margin:3px 0}
.d-sub{display:flex;gap:12px;font-size:.76rem;color:var(--muted);flex-wrap:wrap}
.d-sub .ok{color:var(--ok);font-weight:600}
.fab{width:58px;height:58px;border-radius:calc(var(--r) + 2px);background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 10px 24px -8px var(--accent);transition:transform .35s var(--spring),opacity .3s,width .35s var(--ease)}
.fab svg{width:1.6rem;height:1.6rem;stroke-width:2.4;transition:transform .4s var(--spring)}
.fab:active{transform:scale(.9)}
.fab:active svg{transform:rotate(90deg)}
#dock.nofab .fab{opacity:0;width:0;pointer-events:none}

/* ---------- botões / formulários ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:46px;padding:0 18px;border-radius:calc(var(--r) - 2px);font-weight:700;transition:transform .2s var(--spring),filter .2s,background .2s}
.btn svg{width:1.05rem;height:1.05rem}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 8px 18px -8px var(--accent)}
.btn.soft{background:var(--soft);color:var(--accent)}
[data-theme=dark] .btn.soft{color:color-mix(in srgb,var(--accent) 65%,#fff)}
.btn.plain{background:var(--surface2)}
.btn.danger{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}

#sheetRoot{position:fixed;inset:0;z-index:50;display:none}
#sheetRoot.show{display:block}
.backdrop{position:absolute;inset:0;background:rgba(10,8,20,.42);opacity:0;transition:opacity .3s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:6px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .42s var(--ease);box-shadow:0 -20px 50px -20px rgba(0,0,0,.4);overscroll-behavior:contain}
#sheetRoot.in .backdrop{opacity:1}
#sheetRoot.in .sheet{transform:none}
@media(min-width:700px){
  .sheet{top:50%;bottom:auto;border-radius:26px;transform:translateY(-46%) scale(.96);opacity:0;transition:transform .35s var(--ease),opacity .25s;padding-bottom:22px}
  #sheetRoot.in .sheet{transform:translateY(-50%);opacity:1}
  .grab{display:none}
}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 4px}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:10px 0 14px;position:sticky;top:-6px;background:var(--surface);z-index:2}
.sh-head h3{margin:0;font-size:1.2rem;letter-spacing:-.01em}
.sh-head .icon-btn{box-shadow:none;background:var(--surface2);width:36px;height:36px}
.form{display:flex;flex-direction:column;gap:14px}
.fld label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin:0 0 6px 2px}
.fld input:not([type=checkbox]):not([type=color]),.fld textarea{width:100%;height:50px;padding:0 14px;border-radius:calc(var(--r) - 4px);border:1.5px solid transparent;background:var(--surface2);font-size:max(16px,1rem);outline:none;transition:border-color .2s,background .2s,box-shadow .2s}
.fld textarea{height:110px;padding:12px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.fld input:focus,.fld textarea:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--soft)}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;pointer-events:none}
.fld .money input{padding-left:42px!important;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f-act{display:flex;gap:10px;margin-top:4px}
.f-act .primary{flex:1}
.calc{font-size:.85rem;color:var(--muted);background:var(--soft);padding:10px 14px;border-radius:calc(var(--r) - 4px);display:none}
.calc.show{display:block}
.calc b{color:var(--text)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.seg{position:relative;display:flex;background:var(--surface2);border-radius:calc(var(--r) - 4px);padding:4px}
.seg .ind{position:absolute;top:4px;bottom:4px;left:0;border-radius:calc(var(--r) - 7px);background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.12);transition:transform .35s var(--ease),width .35s var(--ease)}
[data-theme=dark] .seg .ind{background:#34323f}
.seg button{position:relative;z-index:1;flex:1;height:38px;font-weight:600;font-size:.85rem;color:var(--muted);transition:color .2s;white-space:nowrap;padding:0 6px}
.seg button.on{color:var(--text)}
.sw-row{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:34px;height:34px;border-radius:50%;background:var(--c);position:relative;transition:transform .25s var(--spring)}
.swatch::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2.5px solid var(--c);opacity:0;transform:scale(.8);transition:all .25s var(--spring)}
.swatch.on::after{opacity:1;transform:none}
.swatch:active{transform:scale(.88)}
.swatch.none{--c:var(--muted);background:var(--surface2);border:2px dashed color-mix(in srgb,var(--muted) 55%,transparent)}
.swatch.custom{background:conic-gradient(#f43f5e,#f59e0b,#84cc16,#06b6d4,#6366f1,#d946ef,#f43f5e);--c:var(--muted);overflow:visible;cursor:pointer}
.swatch.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.emo-row{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emo-row button{height:42px;border-radius:12px;font-size:1.25rem;background:var(--surface2);transition:transform .25s var(--spring),background .2s}
.emo-row button.on{background:var(--soft);box-shadow:inset 0 0 0 2px var(--accent);transform:scale(1.06)}

.sec{margin:6px 0 18px}
.sec>h5{margin:0 0 10px 2px;font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.card-s{background:var(--surface2);border-radius:var(--r);padding:4px 14px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.opt:first-child{border-top:0}
.opt>span{font-weight:600;font-size:.92rem}
.opt>span small{display:block;font-weight:400;color:var(--muted);font-size:.76rem;margin-top:2px}
.opt.col{flex-direction:column;align-items:stretch}
.opt.tr{padding:6px 2px;border:0}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1;width:100%;height:100%}
.sw i{position:absolute;inset:0;border-radius:99px;background:color-mix(in srgb,var(--muted) 35%,transparent);transition:background .25s}
.sw i::after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(20px)}
.tabrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.tabrow:first-child{border-top:0}
.tabrow .e{font-size:1.2rem}
.tabrow .t{flex:1;font-weight:600}
.tabrow .t small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:.78rem;color:var(--muted);text-align:center;margin:4px 8px 0;line-height:1.5}
.muted{color:var(--muted)}.small{font-size:.85rem}.center{text-align:center}

/* calendário */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.cal-head b{flex:1;text-align:center;font-size:1.3rem;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.cal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 12px;border-radius:var(--r);background:var(--surface2);text-align:left;transition:transform .25s var(--spring),background .2s;animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0) * 22ms)}
.mc:active{transform:scale(.94)}
.mc .mn{font-weight:700;text-transform:capitalize;font-size:1rem}
.mc .mv{font-size:.78rem;font-variant-numeric:tabular-nums}
.mc .mi{font-size:.72rem;color:var(--ok);font-variant-numeric:tabular-nums;min-height:1em;font-weight:600}
.mc .dot{position:absolute;right:11px;top:13px}
.mc.cur{box-shadow:inset 0 0 0 1.5px var(--accent)}
.mc.sel{background:var(--accent);color:#fff;box-shadow:0 10px 20px -10px var(--accent)}
.mc.sel .mi{color:#fff;opacity:.9}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)}.dot.over{background:var(--bad)}.dot.pend{background:var(--warn)}.dot.plan{background:var(--accent);opacity:.55}
.mc.sel .dot{box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.cal-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 10px}
.cal-sum>div{background:var(--surface2);border-radius:var(--r);padding:10px 12px;min-width:0}
.cal-sum small{display:block;font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-sum b{font-size:.95rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.cal-sum .okc{color:var(--ok)}.cal-sum .badc{color:var(--bad)}
.cal-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.74rem;color:var(--muted)}
.cal-leg .dot{margin-right:5px}

/* histórico */
.hday{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:16px 2px 4px}
.hev{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);animation:rise .35s var(--ease) both}
.hday+.hev{border-top:0}
.hic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:800;background:color-mix(in srgb,var(--hc) 16%,transparent);color:var(--hc)}
.hev .tx{flex:1;min-width:0;font-size:.9rem;line-height:1.35;word-break:break-word}
.hev .tx small{display:block;color:var(--muted);font-size:.72rem;margin-top:1px}
.hev time{font-size:.74rem;color:var(--muted);white-space:nowrap;padding-top:2px}

#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translate(-50%,20px) scale(.95);opacity:0;pointer-events:none;z-index:60;display:flex;align-items:center;gap:14px;padding:12px 14px 12px 18px;border-radius:999px;background:#1d1b26;color:#fff;font-size:.88rem;font-weight:600;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:all .35s var(--spring);white-space:nowrap;max-width:calc(100vw - 24px)}
#toast span{overflow:hidden;text-overflow:ellipsis}
[data-theme=dark] #toast{background:#f2f1f7;color:#1d1b26}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:#c4b8ff;font-weight:800;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.12)}
[data-theme=dark] #toast button{color:#4a3bb8;background:rgba(0,0,0,.08)}
.spark{position:fixed;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:70}
@media(min-width:700px){.panel{padding:24px 24px 150px}.app{padding-top:28px}}
@media(hover:hover){.btn:hover{filter:brightness(1.06)}}
/* arrastar para reordenar */
.srow .item,.ccard,.tab{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
@media(hover:hover){.srow .item,.ccard,.tab{cursor:grab}}
.srow .item .main,.srow .item .val,.check,.star-btn,.rowdel{cursor:pointer}
body.is-sorting,body.is-sorting *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
.shifting{transition:transform .25s var(--ease)!important}
.srow.sorting{overflow:visible;z-index:30;transition:none!important}
.srow.sorting .item{box-shadow:0 18px 36px -12px rgba(20,12,50,.45);transition:none}
.cc.sorting{z-index:30;transition:none!important}
.cc.sorting .ccard{box-shadow:0 24px 40px -14px var(--c)}
.tab.sorting{z-index:30;transition:none!important;background:var(--surface);color:var(--text);border-radius:14px;box-shadow:0 12px 26px -8px rgba(0,0,0,.4)}
.tab.sorting::before,.tab.sorting::after{display:none}

#login{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
#login.show{display:flex}
#login form{width:min(380px,100%);background:var(--surface);border-radius:calc(var(--r) + 10px);padding:28px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;animation:rise .5s var(--ease)}
#login .logo{margin:0 auto 4px;width:56px;height:56px;font-size:1.15rem}
#login h2{margin:0;text-align:center;letter-spacing:-.02em}
#login p.err{margin:0;text-align:center;color:var(--bad);font-size:.85rem;min-height:1.2em}
#login input{width:100%;height:50px;padding:0 14px;border-radius:calc(var(--r) - 4px);border:1.5px solid transparent;background:var(--surface2);font-size:max(16px,1rem);outline:none}
#login input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--soft)}
.syncdot{position:fixed;top:calc(env(safe-area-inset-top) + 6px);right:10px;font-size:.68rem;color:var(--muted);z-index:5;pointer-events:none}
</style>

<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">R$</div><h1>Finanças</h1></div>
    <div class="top-act">
      <button class="icon-btn" id="histBtn" aria-label="Histórico de alterações"></button>
      <button class="icon-btn" id="lockBtn" aria-label="Bloquear dados"></button>
      <button class="icon-btn" id="hideBtn" aria-label="Esconder valores"></button>
      <button class="icon-btn" id="setBtn" aria-label="Personalizar"></button>
    </div>
  </header>
  <div class="mbar">

</div>

</div>

<div id="login"><form id="loginForm" autocomplete="on"><div class="logo">R$</div><h2>Finanças</h2><input name="u" autocomplete="username" autocapitalize="none" autocorrect="off" placeholder="Usuário"><input name="p" type="password" autocomplete="current-password" placeholder="Senha"><p class="err" id="loginErr"></p><button class="btn primary block" type="submit">Entrar</button></form></div>
<div class="syncdot" id="syncDot"></div>
<div id="sheetRoot"></div>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
(()=>{
/* ================= utilidades ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const KEY='financas.app.v2',OLDKEY='financas.app.v1';
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const compact=new Intl.NumberFormat('pt-BR',{notation:'compact',maximumFractionDigits:1});
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num2=v=>(v||v===0)&&v!==''?Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'';
function parseMoney(s){
  if(typeof s==='number')return s;
  s=String(s||'').replace(/[^\d,.-]/g,'');
  if(!s)return 0;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=parseFloat(s);return isFinite(n)?Math.round(n*100)/100:0;
}
const clampDay=v=>{const n=parseInt(v);return n>=1&&n<=31?n:null};
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const mqDark=matchMedia('(prefers-color-scheme: dark)');

/* ---- meses ---- */
const MN=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const mkOf=(y,m)=>y+'-'+String(m).padStart(2,'0');
const mi=k=>{const p=k.split('-');return +p[0]*12+(+p[1]-1)};
const im=i=>mkOf(Math.floor(i/12),i%12+1);
const addM=(k,n)=>im(mi(k)+n);
const nowMk=()=>{const d=new Date();return mkOf(d.getFullYear(),d.getMonth()+1)};
const mLong=k=>MN[+k.slice(5)-1]+' de '+k.slice(0,4);
const mShort=k=>MS[+k.slice(5)-1]+'/'+k.slice(2,4);
function rel(k){const d=mi(k)-mi(nowMk());return d===0?'mês atual':d===1?'próximo mês':d===-1?'mês passado':d>0?`em ${d} meses`:`há ${-d} meses`}

const ic={
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  gear:'<svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>',
  eye:'<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff:'<svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
  refresh:'<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>',
  edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>',

const isPaid=(it,mk)=>!!(it.paid&&it.paid[mk]);
const isLV=(it,mk)=>!(it.skip&&it.skip[mk])&&mi(mk)>=mi(it.start)&&(it.rec?(!it.end||mi(mk)<=mi(it.end)):mk===it.start);
const lval=(it,mk)=>it.vals&&it.vals[mk]!=null?it.vals[mk]:it.value;
const instN=(it,mk)=>{const n=mi(mk)-mi(it.start)+1;return n>=1&&n<=it.total?n:0};
const entN=(e,mk)=>{if(!(e.of>1))return mk===e.start?1:0;const n=mi(mk)-mi(e.start)+1;return n>=1&&n<=e.of?n:0};
const vis=(t,mk)=>t.type==='list'?t.items.filter(i=>isLV(i,mk)):t.type==='inst'?t.items.filter(i=>instN(i,mk)):t.items;
const ents=(c,mk)=>c.entries.filter(e=>entN(e,mk));
const cardMan=(c,mk)=>!!(c.manual&&c.manual[mk]!=null);
const cardTot=(c,mk)=>cardMan(c,mk)?+c.manual[mk]:sum(ents(c,mk),e=>e.value);
function paidCount(i){let c=0;const s=mi(i.start);for(let k=0;k<i.total;k++)if(isPaid(i,im(s+k)))c++;return c}
function remParcels(i,mk){let c=0;const s=Math.max(mi(mk),mi(i.start)),e=mi(i.start)+i.total-1;for(let m=s;m<=e;m++)if(!isPaid(i,im(m)))c++;return c}
function totals(t,mk){
  if(t.type==='list'){const v=vis(t,mk),total=sum(v,i=>lval(i,mk)),paid=sum(v.filter(i=>isPaid(i,mk)),i=>lval(i,mk));return{total,paid,pending:total-paid,n:v.length}}
  if(t.type==='inst'){const v=vis(t,mk),total=sum(v,i=>i.value),paid=sum(v.filter(i=>isPaid(i,mk)),i=>i.value);return{total,paid,pending:total-paid,n:v.length,remaining:sum(t.items,i=>i.value*remParcels(i,mk))}}
  if(t.type==='cards'){const total=sum(t.items,c=>cardTot(c,mk)),limit=sum(t.items,c=>c.limit),paid=sum(t.items.filter(c=>isPaid(c,mk)),c=>cardTot(c,mk));return{total,limit,avail:limit-total,paid,pending:total-paid,n:t.items.length}}
  return{total:0,paid:0,pending:0,n:0};
}
const allExpenses=mk=>sum(S.tabs.filter(t=>t.type!=='sum'),t=>totals(t,mk).total);
const incomeOf=mk=>sum(S.income[mk]||[],e=>e.value);
function statusOf(day,paid,mk){
  if(paid)return'paid';
  const dm=mi(mk)-mi(nowMk()),today=new Date().getDate();
  if(dm<0)return'over';if(dm>0)return'ok';
  if(!day)return'ok';const d=day-today;
  return d<0?'over':d<=3?'soon':'ok';
}
function dueTag(day,paid,mk){
  const dm=mi(mk)-mi(nowMk()),today=new Date().getDate();
  if(paid)return'<span class="tag ok">Paga</span>';
  if(dm<0)return`<span class="tag bad">Não paga${day?` · dia ${day}`:''}</span>`;
  if(dm>0)return day?`<span>Vence dia ${day}</span>`:'';
  if(!day)return'';
  const d=day-today;
  if(d<0)return`<span class="tag bad">Venceu dia ${day}</span>`;
  if(d===0)return'<span class="tag warn">Vence hoje</span>';
  if(d<=3)return`<span class="tag warn">Vence em ${d} dia${d>1?'s':''}</span>`;
  return`<span>Vence dia ${day}</span>`;
}
function scan(mk){
  const now=nowMk(),today=new Date().getDate();let pend=0,over=0,n=0;
  const chk=(day,paid)=>{n++;if(paid)return;pend++;if(mi(mk)<mi(now)||(mk===now&&day&&day<today))over++};
  S.tabs.forEach(t=>{
    if(t.type==='list'||t.type==='inst')vis(t,mk).forEach(i=>chk(i.day,isPaid(i,mk)));
    else if(t.type==='cards')t.items.forEach(c=>{if(cardTot(c,mk)>0)chk(c.due,isPaid(c,mk))});
  });
  return{pend,over,n,exp:allExpenses(mk),inc:incomeOf(mk)};
}

  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cols=color?[color]:[getComputedStyle(document.documentElement).getPropertyValue('--accent'),'#10b981','#f59e0b','#ec4899'];
  for(let k=0;k<14;k++){

    document.body.appendChild(s);
    const a=Math.PI*2*k/14+Math.random()*.4,d=26+Math.random()*26;
    s.animate([{transform:'translate(0,0) scale(1) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.3) rotate(${Math.random()*360}deg)`,opacity:0}],{duration:650+Math.random()*250,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>s.remove();

    if(cc){const unit=cc.closest('.cc');return{kind:'card',unit,handle:cc,cont:unit.parentElement,axis:'y',group:'cards',sel:'.cc'}}
    const tb=t.closest('.tab');
    if(tb)return{kind:'tab',unit:tb,handle:tb,cont:tb.parentElement,axis:'x',group:'tabs',sel:'.tab'};
    return null;
  }
  document.addEventListener('pointerdown',e=>{
    if(!e.target.closest('.srow.open'))closeRows();
    if(root.classList.contains('show')||(e.pointerType==='mouse'&&e.button!==0)||e.target.closest('input,textarea,select'))return;
    const inf=info(e.target);if(!inf)return;
    g=Object.assign(inf,{x:e.clientX,y:e.clientY,id:e.pointerId,type:e.pointerType,dir:0,x2:null,base:inf.unit.classList.contains('open')?-96:0,timer:null});
    if(g.type!=='mouse')g.timer=setTimeout(()=>{if(g&&!g.dir)startSort()},LONG);
  });
  document.addEventListener('pointermove',e=>{
    if(ds){if(e.pointerId===ds.id){ds.cx=e.clientX;ds.cy=e.clientY;updateSort()}return}
    if(!g||e.pointerId!==g.id||g.dir===2)return;
    const dx=e.clientX-g.x,dy=e.clientY-g.y,ax=Math.abs(dx),ay=Math.abs(dy);
    if(g.dir===1){const x=Math.max(-140,Math.min(0,g.base+dx));g.x2=x;g.handle.style.transform=`translateX(${x}px)`;return}
    if(ax<MOVE&&ay<MOVE)return;
    if(g.swipe&&ax>ay*1.4){
      if(S.locked){clearTimeout(g.timer);g=null;return}
      clearTimeout(g.timer);g.dir=1;g.unit.classList.add('drag');try{g.handle.setPointerCapture(e.pointerId)}catch(_){}closeRows(g.unit);return;
    }
    if(g.type==='mouse'){
      const m=g.axis==='y'?ay:ax,o=g.axis==='y'?ax:ay;
      if(m>MOVE&&m>o*1.2){g.dir=2;startSort()}
    }else{clearTimeout(g.timer);g=null}
  });
  function startSort(){
    const s=g;if(!s)return;clearTimeout(s.timer);g=null;
    if(locked())return;
    $('#panel').classList.remove('enter','from-l');
    if(s.kind==='card'){$$('.cc.open',s.cont).forEach(c=>c.classList.remove('open'));$$('.cc-body',s.cont).forEach(b=>b.style.transition='none');void s.cont.offsetHeight}
    closeRows();
    const units=[...s.cont.children].filter(c=>c.matches(s.sel)),idx=units.indexOf(s.unit);
    if(units.length<2||idx<0){if(s.kind==='card')renderPanel();return}
    const ax=s.axis==='y',sy=scrollY,sx=scrollX,csl=s.cont.scrollLeft;
    const rects=units.map(u=>{const r=u.getBoundingClientRect();return{pos:ax?r.top+sy:r.left+sx,size:ax?r.height:r.width}});
    const cs=getComputedStyle(s.cont),gap=parseFloat(ax?cs.rowGap:cs.columnGap)||0;
    units.forEach(u=>{u.style.animation='none'});
    ds={id:s.id,kind:s.kind,group:s.group,cont:s.cont,unit:s.unit,units,rects,idx,cur:idx,gap,ax,x0:s.x,y0:s.y,cx:s.x,cy:s.y,sy,sx,csl,raf:0};
    s.unit.classList.add('sorting');units.forEach(u=>{if(u!==s.unit)u.classList.add('shifting')});
    document.body.classList.add('is-sorting');
    try{s.handle.setPointerCapture(s.id)}catch(_){}
    if(navigator.vibrate)navigator.vibrate(12);
    updateSort();loop();
  }
  function updateSort(){
    const d=ds;if(!d)return;
    const dd=d.ax?(d.cy-d.y0)+(scrollY-d.sy):(d.cx-d.x0)+(scrollX-d.sx)+(d.cont.scrollLeft-d.csl);
    const me=d.rects[d.idx];
    d.unit.style.transform=d.ax?`translateY(${dd}px) scale(1.02)`:`translateX(${dd}px) scale(1.05)`;
    const center=me.pos+me.size/2+dd;let n=d.idx;
    for(let i=d.idx+1;i<d.rects.length;i++){const r=d.rects[i];if(center>r.pos+r.size/2)n=i;else break}
    for(let i=d.idx-1;i>=0;i--){const r=d.rects[i];if(center<r.pos+r.size/2)n=i;else break}
    d.cur=n;const shift=me.size+d.gap;
    d.units.forEach((u,i)=>{if(u===d.unit)return;let t=0;
      if(d.idx<n&&i>d.idx&&i<=n)t=-shift;else if(d.idx>n&&i<d.idx&&i>=n)t=shift;
      u.style.transform=t?(d.ax?`translateY(${t}px)`:`translateX(${t}px)`):''});
  }
  function loop(){
    const d=ds;if(!d)return;
    if(d.ax){const top=90,bot=innerHeight-150;let v=0;if(d.cy<top)v=-Math.min(20,(top-d.cy)/4+3);else if(d.cy>bot)v=Math.min(20,(d.cy-bot)/4+3);if(v){scrollBy(0,v);updateSort()}}
    else{const r=d.cont.getBoundingClientRect();let v=0;if(d.cx<r.left+44)v=-10;else if(d.cx>r.right-44)v=10;if(v){d.cont.scrollLeft+=v;updateSort()}}
    d.raf=requestAnimationFrame(loop);
  }
  function finishSort(cancel){
    const d=ds;ds=null;cancelAnimationFrame(d.raf);
    document.body.classList.remove('is-sorting');
    swMoved=true;setTimeout(()=>swMoved=false,100);
    d.units.forEach(u=>{u.style.transform='';u.classList.remove('sorting','shifting')});
    $$('.cc-body',d.cont).forEach(b=>b.style.transition='');
    if(cancel||d.cur===d.idx){if(d.kind==='card')renderPanel();return}
    const ids=d.units.map(unitId);const m=ids.splice(d.idx,1)[0];ids.splice(d.cur,0,m);
    applyOrder(d,ids);
  }
  const end=e=>{
    if(ds){if(e.pointerId===ds.id)finishSort(e.type==='pointercancel');return}
    if(!g||e.pointerId!==g.id)return;
    clearTimeout(g.timer);const s=g;g=null;
    if(s.dir!==1)return;
    s.unit.classList.remove('drag');s.handle.style.transform='';
    s.unit.classList.toggle('open',(s.x2??0)<-48);
    swMoved=true;setTimeout(()=>swMoved=false,60);
  };
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
  document.addEventListener('touchmove',e=>{if(ds&&e.cancelable)e.preventDefault()},{passive:false});
  document.addEventListener('contextmenu',e=>{if(ds||(g&&g.type!=='mouse'))e.preventDefault()});
  document.addEventListener('selectstart',e=>{if(ds)e.preventDefault()});
})();

function togglePaid(t,item){
  const on=!isPaid(item,MK);item.paid=item.paid||{};if(on)item.paid[MK]=1;else delete item.paid[MK];

function deleteItem(t,item){
  if(t.type==='list'&&item.rec)return delScope(t,item);
  snapshot();t.items=t.items.filter(x=>x!==item);
  logEv('del',`Excluído: ${item.name} · ${BRL.format(t.type==='list'?lval(item,MK):item.value)}${t.type==='inst'?' (parcelado)':''}`);
  commit();toast(`“${esc(item.name)}” excluído`,true);
}
function delScope(t,item){
  const m=mShort(MK);
  openSheet(`Excluir “${esc(item.name)}”`,`<div class="form"><p class="muted small" style="margin:0">Essa conta se repete todo mês. O que você quer remover?</p>
    <button class="btn plain block" data-ds="one">Só em ${m}</button>
    <button class="btn plain block" data-ds="fwd">De ${m} em diante</button>
    <button class="btn danger block" data-ds="all">Em todos os meses (apaga o histórico dela)</button></div>`,r=>{
    $$('[data-ds]',r).forEach(b=>b.onclick=()=>{
      snapshot();const k=b.dataset.ds;let txt;
      if(k==='one'){item.skip=item.skip||{};item.skip[MK]=1;txt=`só em ${m}`}
      else if(k==='fwd'){if(mi(MK)<=mi(item.start)){t.items=t.items.filter(x=>x!==item)}else item.end=addM(MK,-1);txt=`de ${m} em diante`}
      else{t.items=t.items.filter(x=>x!==item);txt='em todos os meses'}
      logEv('del',`Excluída: ${item.name} (${txt})`);commit();closeSheet();toast(`“${esc(item.name)}” excluída`,true);
    });
  });
}
function deleteEntry(card,en){snapshot();card.entries=card.entries.filter(x=>x!==en);logEv('del',`Lançamento excluído: ${en.name} · ${BRL.format(en.value)} (${card.name})`);commit();toast('Lançamento excluído',true)}
function deleteIncome(id){const list=S.income[MK]||[],e=list.find(x=>x.id===id);if(!e)return;snapshot();S.income[MK]=list.filter(x=>x.id!==id);logEv('inc',`Entrada excluída: ${e.name} · ${BRL.format(e.value)} (${mShort(MK)})`);commit();toast('Entrada excluída',true)}

$('#panel').addEventListener('click',e=>{

  const a=e.target.closest('[data-act]');if(!a)return;
  const t=activeTab(),act=a.dataset.act;
  const id=e.target.closest('[data-id]')?.dataset.id,item=id&&t.items.find(x=>x.id===id);
  const cEl=e.target.closest('[data-card]'),card=cEl&&t.items.find(x=>x.id===cEl.dataset.card);
  const eid=e.target.closest('[data-entry]')?.dataset.entry,entry=card&&eid&&card.entries.find(x=>x.id===eid);
  const iid=e.target.closest('[data-inc]')?.dataset.inc,inc=iid&&(S.income[MK]||[]).find(x=>x.id===iid);
  switch(act){
    case'add':return addItem();
    case'toggle':if(locked('pay'))return;return togglePaid(t,item);
    case'edit':if(locked())return;return itemSheet(t,item);
    case'star':{if(locked())return;item.star=!item.star;logEv('edit',`${item.name}: ${item.star?'destacada ⭐':'destaque removido'}`);save();renderPanel();
      const b=$(`[data-id="${item.id}"] .star-btn`);if(b){b.classList.add('pop');if(item.star)burst(b,'#f5b301')}return}
    case'del':if(locked())return;return deleteItem(t,item);
    case'swdel':{if(locked())return;
      if(inc)return deleteIncome(inc.id);
      if(entry)return deleteEntry(card,entry);
      if(item)return deleteItem(t,item);return}
    case'payAll':{if(locked('pay'))return;snapshot();let n=0;vis(t,MK).forEach(i=>{if(!isPaid(i,MK)){i.paid=i.paid||{};i.paid[MK]=1;n++}});
      logEv('pay',`${n} ${n>1?'itens marcados':'item marcado'} como ${n>1?'pagos':'pago'} em ${t.name} (${mShort(MK)})`);commit();toast(`${n} ${n>1?'itens pagos':'item pago'} ✓`,true);return}
    case'cardToggle':{const o=!openCards.has(card.id);o?openCards.add(card.id):openCards.delete(card.id);cEl.classList.toggle('open',o);a.setAttribute('aria-expanded',o);return}
    case'entryAdd':if(locked())return;return entrySheet(card,null);
    case'entryEdit':if(locked())return;return entrySheet(card,entry);
    case'cardEdit':if(locked())return;return cardSheet(card);
    case'cardTotal':if(locked())return;return cardTotalSheet(card);
    case'cardPaid':{if(locked('pay'))return;card.paid=card.paid||{};const on=!isPaid(card,MK);if(on)card.paid[MK]=1;else delete card.paid[MK];
      logEv(on?'pay':'unpay',`Fatura ${card.name} ${on?'marcada como paga':'reaberta'} · ${BRL.format(cardTot(card,MK))} (${mShort(MK)})`);save();renderPanel();if(on)burst($(`[data-card="${card.id}"] .cc-amt`),'#fff');return}
    case'tabMenu':if(locked())return;return tabSheet(t);
    case'clearSample':{if(locked())return;snapshot();S.tabs.forEach(x=>x.items=[]);S.income={};S.log=[];S.sample=false;commit();toast('Tudo limpo. Bora começar!',true);return}
    case'keepSample':{S.sample=false;commit();return}
    case'incAdd':if(locked())return;return incomeSheet(null);
    case'incEdit':if(locked())return;return incomeSheet(inc);
    case'unlock':return toggleLock();
  }
});

const root=$('#sheetRoot');
function openSheet(title,body,onMount){
  root.innerHTML=`<div class="backdrop"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sh-head"><h3>${title}</h3><button class="icon-btn" data-close aria-label="Fechar">${ic.x}</button></div><div class="sh-body">${body}</div></div>`;
  root.classList.add('show');void root.offsetWidth;root.classList.add('in');
  requestAnimationFrame(()=>$$('.seg',root).forEach(syncSeg));
  onMount&&onMount(root);
  const first=$('input[data-autofocus]',root);if(first&&matchMedia('(hover:hover)').matches)setTimeout(()=>first.focus(),250);
  dragToClose($('.sheet',root));
}
function closeSheet(){root.classList.remove('in');setTimeout(()=>{if(!root.classList.contains('in')){root.classList.remove('show');root.innerHTML=''}},380)}
function dragToClose(sh){
  let y0=null,dy=0;
  sh.addEventListener('touchstart',e=>{if(!e.target.closest('.grab,.sh-head'))return;y0=e.touches[0].clientY;dy=0;sh.style.transition='none'},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform=`translateY(${dy}px)`},{passive:true});
  sh.addEventListener('touchend',()=>{if(y0===null)return;y0=null;sh.style.transition='';sh.style.transform='';if(dy>110)closeSheet()});
}
const fld=(l,h)=>`<div class="fld"><label>${l}</label>${h}</div>`;
const moneyIn=(n,v,auto)=>`<div class="money"><span>R$</span><input name="${n}" class="money-in" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${v||v===0?num2(v):''}" ${auto?'data-autofocus':''}></div>`;

const swatches=(name,list,val,setting)=>`<div class="sw-row" ${setting?`data-setting="${setting}"`:''}><input type="hidden" name="${name}" value="${val}">${list.map(c=>`<button type="button" class="swatch ${c===val?'on':''}" data-color="${c}" style="--c:${c}" aria-label="${c}"></button>`).join('')}<label class="swatch custom ${list.includes(val)?'':'on'}" title="Outra cor"><input type="color" value="${val}"></label></div>`;
const colorPick=(name,val)=>`<div class="sw-row"><input type="hidden" name="${name}" value="${val}"><button type="button" class="swatch none ${val===''?'on':''}" data-color="" aria-label="Sem cor" title="Sem cor"></button>${DEBTC.map(c=>`<button type="button" class="swatch ${c===val?'on':''}" data-color="${c}" style="--c:${c}" aria-label="${c}"></button>`).join('')}<label class="swatch custom ${val&&!DEBTC.includes(val)?'on':''}" title="Outra cor"><input type="color" value="${val||'#6c5ce7'}"></label></div>`;
const emojis=val=>`<div class="emo-row"><input type="hidden" name="emoji" value="${val}">${EMOJIS.map(e=>`<button type="button" data-emo="${e}" class="${e===val?'on':''}">${e}</button>`).join('')}</div>`;
const toggle=(k)=>`<label class="sw"><input type="checkbox" data-toggle="${k}" ${S.settings[k]?'checked':''}><i></i></label>`;
const toggleRow=(n,l,s,on)=>`<div class="opt tr"><span>${l}<small>${s}</small></span><label class="sw"><input type="checkbox" name="${n}" ${on?'checked':''}><i></i></label></div>`;
const formWrap=(inner,isNew,addLbl)=>`<form class="form" novalidate>${inner}<div class="f-act">${isNew?'':`<button type="button" class="btn danger" data-del>${ic.trash}<span>Excluir</span></button>`}<button type="submit" class="btn primary">${isNew?(addLbl||'Adicionar'):'Salvar'}</button></div></form>`;

/* ---- conta / parcelado ---- */
function itemSheet(t,item){
  const isNew=!item,it=item||{},inst=t.type==='inst',ml=mShort(MK);
  const curVal=isNew?'':(inst?it.value:lval(it,MK));
  let f=fld(inst?'O que foi comprado':'Nome da conta',`<input name="name" autocomplete="off" data-autofocus enterkeyhint="next" value="${esc(it.name||'')}" placeholder="${inst?'Ex.: Geladeira':'Ex.: Aluguel'}">`);
  f+=`<div class="row2">${fld(inst?'Valor da parcela':(isNew?'Valor':`Valor em ${ml}`),moneyIn('value',curVal))}${fld('Vence dia',dayIn('day',it.day))}</div>`;
  if(inst)f+=`<div class="row2">${fld('Nº de parcelas',`<input name="total" type="number" inputmode="numeric" min="1" max="420" placeholder="12" value="${it.total||''}">`)}${fld(`Parcela de ${ml}`,`<input name="n" type="number" inputmode="numeric" min="1" placeholder="1" value="${isNew?1:instN(it,MK)||1}">`)}</div><div class="calc" id="calc"></div>`;
  else if(!isNew&&it.rec)f+=fld('Se mudar o valor, aplicar…',seg('scope',[['one','Só em '+ml],['fwd','Daqui pra frente']],'one'));
  f+=fld('Cor da conta',colorPick('color',it.color||''));
  f+=toggleRow('star','⭐ Destacar','Fica no topo, com realce',!!it.star);
  if(isNew&&!inst)f+=toggleRow('rec','🔁 Repete todo mês','Desligue para uma conta só de '+ml,UI.rep);

        c.classList.toggle('show',v>0&&n>0);c.innerHTML=`Total da compra <b>${BRL.format(v*n)}</b> em ${n}x`};
      fm.addEventListener('input',upd);upd()}
    fm.onsubmit=e=>{e.preventDefault();const {d,name}=getForm(r);if(!d.name.trim())return shake(name);
      const val=parseMoney(d.value),nm=d.name.trim(),day=clampDay(d.day);
      if(isNew){
        const o={id:uid(),name:nm,day,color:d.color||'',star:!!d.star,paid:{},value:val};
        if(inst){o.total=Math.max(1,parseInt(d.total)||1);const n=Math.min(o.total,Math.max(1,parseInt(d.n)||1));o.start=addM(MK,-(n-1));for(let k=1;k<n;k++)o.paid[addM(MK,-k)]=1}
        else{o.rec=!!d.rec;UI.rep=o.rec;o.start=MK;o.vals={}}
        t.items.push(o);
        logEv('add',inst?`Parcelado adicionado: ${nm} · ${o.total}x de ${BRL.format(val)}`:`Conta adicionada: ${nm} · ${BRL.format(val)}${o.rec?' · todo mês':' · só '+ml}`);
        commit();closeSheet();toast('Adicionado ✓');setTimeout(()=>{const el=$(`[data-id="${o.id}"]`);el&&el.classList.add('pop')},60);return;
      }
      const ch=[];
      if(nm!==it.name)ch.push(`nome “${it.name}” → “${nm}”`);
      if(inst){
        if(val!==it.value){ch.push(`parcela ${BRL.format(it.value)} → ${BRL.format(val)}`);it.value=val}
        const tot=Math.max(1,parseInt(d.total)||1),n=Math.min(tot,Math.max(1,parseInt(d.n)||1));
        if(tot!==it.total)ch.push(`parcelas ${it.total} → ${tot}`);
        if(n!==instN(it,MK)){ch.push(`parcela de ${ml}: ${instN(it,MK)||'—'} → ${n}`);it.start=addM(MK,-(n-1))}
        it.total=tot;
      }else{
        const old=lval(it,MK);
        if(val!==old){
          if(it.rec&&d.scope==='fwd'){
            for(let m=mi(it.start);m<mi(MK);m++){const k=im(m);if(it.vals[k]==null)it.vals[k]=it.value}
            it.value=val;Object.keys(it.vals).forEach(k=>{if(mi(k)>=mi(MK))delete it.vals[k]});
            ch.push(`valor ${BRL.format(old)} → ${BRL.format(val)} (de ${ml} em diante)`);
          }else if(it.rec){if(val===it.value)delete it.vals[MK];else it.vals[MK]=val;ch.push(`valor ${BRL.format(old)} → ${BRL.format(val)} (só ${ml})`)}
          else{it.value=val;ch.push(`valor ${BRL.format(old)} → ${BRL.format(val)}`)}
        }
      }
      if(day!==(it.day||null)){ch.push(`vence dia ${it.day||'—'} → ${day||'—'}`);it.day=day}
      if((d.color||'')!==(it.color||'')){ch.push('cor alterada');it.color=d.color||''}
      if(!!d.star!==!!it.star){ch.push(d.star?'destacada ⭐':'destaque removido');it.star=!!d.star}
      it.name=nm;
      if(ch.length)logEv('edit',`${nm}: ${ch.join(' · ')}`);
      commit();closeSheet();toast('Salvo ✓');
    };
    bindDel(r,()=>{closeSheet();deleteItem(t,item)});
  });
}

const HK={add:['＋','var(--ok)'],edit:['✎','var(--accent)'],del:['✕','var(--bad)'],pay:['✓','var(--ok)'],unpay:['↩','var(--warn)'],inc:['$','#0ea5e9'],sys:['•','var(--muted)']};
function historySheet(){
  const FL=[['all','Tudo'],['add','Adicionados'],['edit','Editados'],['del','Excluídos'],['pay','Pagamentos'],['inc','Entradas']];
  openSheet('Histórico de alterações',`<div class="flts" id="hf">${FL.map(([v,l])=>`<button class="flt ${UI.hflt===v?'on':''}" data-hf="${v}">${l}</button>`).join('')}</div><div id="hl"></div><div class="f-act" style="margin-top:16px"><button class="btn danger block" id="hclr">${ic.trash}<span>Limpar histórico</span></button></div>`,r=>{
    const draw=()=>{
      const f=UI.hflt,list=S.log.filter(x=>f==='all'||(f==='pay'?(x.k==='pay'||x.k==='unpay'):x.k===f));
      if(!list.length){$('#hl',r).innerHTML=`<div class="empty" style="padding:30px 10px"><span class="big">🕘</span><h3>Nada por aqui ainda</h3><p>Tudo o que você adicionar, editar, pagar ou excluir fica registrado nesta lista.</p></div>`;return}
      const today=new Date(),dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
      const tk=dk(today),yk=dk(today.getTime()-864e5);let last='',h='',n=0;
      list.slice(0,150).forEach(x=>{
        const k=dk(x.t);
        if(k!==last){last=k;h+=`<div class="hday">${k===tk?'Hoje':k===yk?'Ontem':new Date(x.t).toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'})}</div>`}
        const [sym,col]=HK[x.k]||HK.sys;let tx=esc(x.x);
        if(S.settings.hide)tx=tx.replace(/R\$[\s ]*[\d.,]+/g,'R$ •••');
        h+=`<div class="hev" style="--hc:${col};animation-delay:${Math.min(n++,12)*25}ms"><div class="hic">${sym}</div><div class="tx">${tx}</div><time>${new Date(x.t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</time></div>`;
      });
      if(list.length>150)h+=`<p class="note">Mostrando os 150 mais recentes de ${list.length}.</p>`;
      $('#hl',r).innerHTML=h;
    };
    draw();
    $('#hf',r).onclick=e=>{const b=e.target.closest('[data-hf]');if(!b)return;UI.hflt=b.dataset.hf;$$('#hf .flt',r).forEach(x=>x.classList.toggle('on',x===b));draw()};
    const cl=$('#hclr',r);cl.onclick=()=>{
      if(locked())return;
      if(!cl.classList.contains('armed')){cl.classList.add('armed');cl.lastChild.textContent='Toque de novo para confirmar';setTimeout(()=>{cl.classList.remove('armed');cl.lastChild.textContent='Limpar histórico'},3500);return}
      S.log=[];save();draw();cl.classList.remove('armed');cl.lastChild.textContent='Limpar histórico';toast('Histórico limpo');
    };
  });
}

    $('[data-newtab]',r).onclick=()=>{if(locked())return;tabSheet(null)};
    $$('[data-edittab]',r).forEach(b=>b.onclick=()=>{if(locked())return;tabSheet(S.tabs.find(t=>t.id===b.dataset.edittab))});
    $('[data-exp]',r).onclick=()=>{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`financas-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Backup baixado ✓')};
    $('[data-imp]',r).onclick=()=>{if(locked())return;$('#fileIn').click()};
    $('[data-copy]',r).onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));toast('Backup copiado — cole no outro aparelho')}catch(e){pasteSheet(JSON.stringify(S),true)}};
    $('[data-paste]',r).onclick=()=>{if(locked())return;pasteSheet('',false)};
    const rb=$('[data-reset]',r);rb.onclick=()=>{if(locked())return;
      if(!rb.classList.contains('armed')){rb.classList.add('armed');rb.lastChild.textContent='Toque de novo para confirmar';setTimeout(()=>{rb.classList.remove('armed');rb.lastChild.textContent='Apagar tudo'},3500);return}
      snapshot();const keep=S.settings;S=defaults();S.settings=keep;S.sample=false;S.tabs.forEach(t=>t.items=[]);S.income={};S.log=[];logEv('sys','Todos os dados foram apagados');save();closeSheet();renderAll(0);toast('Tudo apagado',true)};
  });
}
function importData(txt){
  try{const d=JSON.parse(txt);if(!d||!Array.isArray(d.tabs)||!d.tabs.length)throw 0;
    snapshot();S=norm(d.v>=2?d:migrate(d));S.sample=false;S.active=null;activeTab();logEv('sys','Backup importado');save();closeSheet();renderAll(0);toast('Backup importado ✓',true)}
  catch(e){toast('Arquivo de backup inválido')}
}
function pasteSheet(val,copyMode){
  openSheet(copyMode?'Copie o backup':'Colar backup',`<form class="form">${fld(copyMode?'Selecione e copie o texto abaixo':'Cole aqui o texto do backup',`<textarea name="data" ${copyMode?'readonly':''}>${esc(val)}</textarea>`)}${copyMode?'':`<div class="f-act"><button class="btn primary" type="submit">Importar</button></div>`}</form>`,r=>{
    const ta=$('textarea',r);if(copyMode){ta.focus();ta.select()}
    $('form',r).onsubmit=e=>{e.preventDefault();importData(ta.value)};
  });
}
$('#fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>importData(rd.result);rd.readAsText(f);e.target.value=''};

/* ================= atalhos (Windows) ================= */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&root.classList.contains('show'))return closeSheet();
  if(root.classList.contains('show')||/INPUT|TEXTAREA/.test(document.activeElement.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();addItem()}
  else if(e.key==='h'||e.key==='H')$('#hideBtn').click();
  else if(e.key==='l'||e.key==='L')toggleLock();
  else if(e.key==='m'||e.key==='M')calSheet();
  else if(e.key==='PageUp'||e.key==='['){e.preventDefault();setMonth(addM(MK,-1),-1)}
  else if(e.key==='PageDown'||e.key===']'){e.preventDefault();setMonth(addM(MK,1),1)}
  else if(/^[1-9]$/.test(e.key))goTab(+e.key-1);
  else if(e.key==='ArrowRight')goTab(S.tabs.findIndex(t=>t.id===S.active)+1);
  else if(e.key==='ArrowLeft')goTab(S.tabs.findIndex(t=>t.id===S.active)-1);
});

/* ================= início ================= */
$('#fab').innerHTML=ic.plus;$('#setBtn').innerHTML=ic.gear;$('#histBtn').innerHTML=ic.clock;
$('#mPrev').innerHTML=ic.left;$('#mNext').innerHTML=ic.right;
$('#mLabel').insertAdjacentHTML('afterbegin',ic.cal);$('#mLabel').insertAdjacentHTML('beforeend',ic.chevd);
activeTab();
if(AUTH){renderAll(0);pullCloud()}else{applySettings();showLogin()}
window.addEventListener('resize',()=>$$('.seg',root).forEach(syncSeg));
document.addEventListener('visibilitychange',()=>{if(!document.hidden){renderMonthBar();renderPanel()}});
})();
</script>
</body>
